name: Shipment Notification (Every 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — check without sending emails (true/false)'
        required: false
        default: 'false'

jobs:
  ship-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install node-fetch@2 pdfkit

      - name: Check shipments and notify
        env:
          PACKIYO_TOKEN:  ${{ secrets.PACKIYO_TOKEN }}
          GIST_ID:        ${{ secrets.GIST_ID }}
          GIST_TOKEN:     ${{ secrets.GIST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN:        ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/ship-notify.js
