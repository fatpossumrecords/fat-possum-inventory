name: Sales Report (Daily Check)

on:
  schedule:
    - cron: '0 10 * * *'  # 5:00 AM CDT / 4:00 AM CST daily
  workflow_dispatch:
    inputs:
      month_override:
        description: 'Override month (YYYY-MM). Leave blank for configured period.'
        required: false
        default: ''
      force_send:
        description: 'Force send even if not scheduled day (true/false)'
        required: false
        default: 'false'

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Generate and email report
        env:
          PACKIYO_TOKEN:          ${{ secrets.PACKIYO_TOKEN }}
          GIST_ID:                ${{ secrets.GIST_ID }}
          GIST_TOKEN:             ${{ secrets.GIST_TOKEN }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          REPORT_TO:              ${{ secrets.REPORT_TO }}
          SHEETS_ID:              ${{ secrets.SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          MONTH_OVERRIDE:         ${{ github.event.inputs.month_override }}
          FORCE_SEND:             ${{ github.event.inputs.force_send }}
        run: node scripts/generate-report.js
